<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhishek Website</title>

  <!-- CSS connect -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h2>Abhishek</h2>
  </div>

  <div class="main">
    <img src="mypic.jpg.jpeg" class="profile">
    <h1>Hi, I'm Abhishek 👋</h1>

    <button onclick="googleLogin()">Login with Google</button>
    <button onclick="logout()">Logout</button>

    <h3 id="welcome"></h3>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "aSyAcTv3Qvp3XlyQp6s6_wQ_9Ou5KR1Y-UNU",
",
      authDomain: "abhishek-website-2d79f.firebaseapp.com",
      projectId: "abhishek-website-2d79f",
      storageBucket: "abhishek-website-2d79f.appspot.com",
      messagingSenderId: "1002360339860",
      appId: "1:1002360339860:web:f999538a9a20897235a381"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.googleLogin = function () {
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          document.getElementById("welcome").innerText =
            "Welcome " + user.displayName;
        })
        .catch((error) => {
          alert(error.message);
        });
    };

    window.logout = function () {
      signOut(auth).then(() => {
        document.getElementById("welcome").innerText = "";
      });
    };
  </script>

</body>
</html>
